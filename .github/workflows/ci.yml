name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: mock CLI smoke test (all three domains)
        run: |
          triage-guard ticket run --file examples/sample_tickets.json --mock
          triage-guard alert run --file examples/sample_alerts.json --mock
          triage-guard deploy-gate run --file examples/sample_prs.json --mock

  live-smoke:
    # Only runs if TYPESAFE_API_KEY is configured as a repo secret; skips
    # cleanly otherwise so forks and secret-less clones still pass CI.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: live smoke test against real Jev
        if: ${{ secrets.TYPESAFE_API_KEY != '' }}
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          triage-guard ticket run "My card was charged twice, please help ASAP." --json
          triage-guard alert run "Total outage across every service, nothing is reachable." --json
          triage-guard deploy-gate run "Adds a migration dropping a column, no rollback plan mentioned." --json
